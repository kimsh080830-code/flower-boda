name: Validate and publish dev preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Guard branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "dev" ]; then
            echo "Blocked: DEV workflow may run only on dev."
            exit 1
          fi

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: |
          npm test

      - name: Build DEV
        run: |
          npm run build:dev

      - name: Verify DEV artifact
        run: |
          test -f index.html
          grep -q 'globalThis.__FLOWER_APP_DEV__=true' index.html
          grep -q '__FLOWER_APP_DEV_PAYLOAD__' index.html

      - name: Commit generated index to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged"
          else
            git commit -m "build: generate index.html"
            git push origin HEAD:dev
          fi

      - name: Publish DEV preview under gh-pages/dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
          rm -rf publish/dev
          mkdir -p publish/dev
          cp index.html publish/dev/index.html
          cp -R assets publish/dev/assets
          touch publish/.nojekyll

          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev .nojekyll
          if git diff --cached --quiet; then
            echo "DEV preview unchanged"
          else
            git commit -m "deploy dev preview: ${GITHUB_SHA}"
            git push origin gh-pages
          fi
