name: Publish production to gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Guard branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Blocked: PROD workflow may run only on main."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: |
          npm test

      - name: Build PROD
        run: |
          npm run build:prod

      - name: Verify PROD artifact
        run: |
          test -f index.prod.html
          grep -q 'globalThis.__FLOWER_APP_DEV__=false' index.prod.html
          if grep -q '__FLOWER_APP_DEV_PAYLOAD__' index.prod.html; then
            echo "Blocked: DEV payload found in PROD artifact."
            exit 1
          fi
          if grep -q 'js/devTools.js' index.prod.html; then
            echo "Blocked: js/devTools.js found in PROD artifact."
            exit 1
          fi
          if grep -q 'js/ui/screens/devTools.js' index.prod.html; then
            echo "Blocked: DEV UI module found in PROD artifact."
            exit 1
          fi

      - name: Publish production root and preserve dev preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish

          find publish -mindepth 1 -maxdepth 1 ! -name .git ! -name dev -exec rm -rf {} +
          cp index.prod.html publish/index.html
          cp -R assets publish/assets
          touch publish/.nojekyll

          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production site unchanged"
          else
            git commit -m "deploy production: ${GITHUB_SHA}"
            git push origin gh-pages
          fi
